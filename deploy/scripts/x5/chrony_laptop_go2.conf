# Go2 rig drop-in for the LAPTOP's chrony (wam_go2_deploy/scripts/x5).
# Installed as /etc/chrony/conf.d/go2_rig.conf by
# laptop_chrony_install.sh (sudo); Ubuntu's /etc/chrony/chrony.conf (internet
# pools, makestep 1 3, rtcsync) stays as shipped, so the laptop keeps real UTC
# whenever it is online.
#
#  - allow: serve NTP to the switch subnet (the RDK X5 camera host).
#  - local stratum 10: keep serving when the laptop has no internet (field use);
#    the rig is then aligned to the laptop, not to UTC - fine for data alignment.
#  - maxslewrate 1000 ppm: the laptop's OWN clock corrects at most 0.1 % fast
#    (Ubuntu's makestep 1 3 steps only in chronyd's first three updates, so a
#    later correction, e.g. when the internet comes back mid-session, is
#    slewed). The X5 does NOT follow that smoothly: chronyd SERVES its corrected
#    time (system clock + pending correction), and the X5 tracks that. A
#    correction > 0.1 s steps the X5 to it at once (chrony_x5.conf makestep
#    0.1 -1; go2_camera.sh then restarts the camera node) while the laptop's
#    CLOCK_REALTIME - the rig's reference clock - catches up at <= 1 ms per
#    second, i.e. over minutes (0.3 s takes 5 min); a smaller one the X5 slews
#    too (<= 1000 ppm). Until the laptop has caught up, X5 and laptop stamps
#    disagree by up to the correction still pending (laptop `chronyc tracking`:
#    System time). Measure it as X5_clock - laptop_clock =
#    SNTP offset - X5 chrony offset, both recorded by sync_check.py.
allow @ROBOT_SUBNET@
local stratum 10
maxslewrate 1000
log tracking
