# chrony on the RDK X5 camera host: CLIENT of the laptop (@LAPTOP_IP@, filled in by x5_chrony_setup.sh),
# which is the whole rig's time source (wam_go2_deploy/scripts/x5).
# Installed as /etc/chrony/chrony.conf by x5_chrony_setup.sh
# (the Ubuntu original is kept as chrony.conf.orig). No internet pools: the X5
# has no route out of the switch subnet and would only spin on DNS.
#
# Why these values:
#  - iburst + minpoll 0 / maxpoll 2: first fix within seconds of the laptop
#    appearing, then a measurement every 1-4 s (LAN, target host offset <1 ms).
#  - makestep 0.1 -1: ALWAYS step when off by more than 100 ms. The X5 RTC is
#    dead (boots in the year 2000), so the first fix is a 26-year step; a manual
#    `date -s` or a laptop clock change can leave a few hundred ms, and slewing
#    that at 1000 ppm would take minutes with wrong camera stamps meanwhile.
#    go2_camera.sh restarts the camera node after any step chrony makes: its
#    clock guard trips when wall-minus-monotonic time moves by more than
#    CLOCK_STEP_THRESHOLD_S = 0.05 s on 2 polls in a row, below this 0.1 s
#    (a slew never moves it). Needed because librealsense (2.58.4) maps device
#    time to the host clock with a running linear fit whose innovation gate
#    rejects every sample more than 100 ms off, so after such a step all D435i
#    stamps stay off by the whole step for ~60 s until the fit re-bases.
#  - maxslewrate 1000 ppm: never correct faster than 0.1 %, so frame timestamps
#    never see a fast-running clock (default would allow 8 %).
#  - allow: lets the laptop's sync_check.py ask this host for its time by SNTP.
#    chronyd serves its CORRECTED time (system clock + pending correction), so
#    SNTP gives X5_corrected - laptop_clock, not an independent copy of the
#    offset chrony reports; X5_clock - laptop_clock = SNTP offset - X5 chrony
#    offset (chrony's offset sign: + = system clock slow).
server @LAPTOP_IP@ iburst minpoll 0 maxpoll 2 xleave
driftfile /var/lib/chrony/chrony.drift
logdir /var/log/chrony
log tracking measurements statistics
makestep 0.1 -1
maxslewrate 1000
maxupdateskew 100.0
allow @ROBOT_SUBNET@
leapsectz right/UTC
